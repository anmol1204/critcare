<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Unilateral superior laryngeal nerve palsy showing a bowed lax cord and an askewed glottis">
  <!-- Original diagram for CritCare.in — own work, released CC0. -->
  <title>Superior laryngeal nerve (SLN) palsy — the bowed, askewed cord</title>
  <text x="310" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="15.5" font-weight="800" fill="#0f172a">Unilateral superior laryngeal nerve (SLN) palsy</text>
  <text x="310" y="42" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#64748b">external branch → cricothyroid weak → the affected cord loses tension: bowed &amp; lax, glottis askewed</text>

  <!-- Panel 1: respiration -->
  <g transform="translate(70,58)">
    <path d="M90 30 C66 40 40 66 34 118 C31 145 58 158 90 158 C122 158 149 145 146 118 C140 66 114 40 90 30 Z" fill="#d7e6f4" stroke="#5b4636" stroke-width="2"/>
    <ellipse cx="80" cy="150" rx="11" ry="7" fill="#c2d6ea" stroke="#5b4636" stroke-width="1.1"/>
    <ellipse cx="100" cy="150" rx="11" ry="7" fill="#c2d6ea" stroke="#5b4636" stroke-width="1.1"/>
    <line x1="90" y1="28" x2="90" y2="160" stroke="#334155" stroke-width=".9" stroke-dasharray="4 4"/>
    <!-- normal right cord (straight) -->
    <line x1="90" y1="34" x2="116" y2="150" stroke="#eab308" stroke-width="7" stroke-linecap="round"/>
    <!-- affected left cord: BOWED / lax -->
    <path d="M90 34 Q58 92 74 150" fill="none" stroke="#dc2626" stroke-width="9" stroke-linecap="round"/>
    <path d="M90 34 Q58 92 74 150" fill="none" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
    <text x="90" y="184" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">At respiration</text>
    <text x="90" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">affected cord bowed &amp; slack</text>
  </g>

  <!-- Panel 2: phonation (askewed) -->
  <g transform="translate(370,58)">
    <path d="M90 30 C66 40 40 66 34 118 C31 145 58 158 90 158 C122 158 149 145 146 118 C140 66 114 40 90 30 Z" fill="#d7e6f4" stroke="#5b4636" stroke-width="2"/>
    <ellipse cx="80" cy="150" rx="11" ry="7" fill="#c2d6ea" stroke="#5b4636" stroke-width="1.1"/>
    <ellipse cx="100" cy="150" rx="11" ry="7" fill="#c2d6ea" stroke="#5b4636" stroke-width="1.1"/>
    <line x1="90" y1="28" x2="90" y2="160" stroke="#334155" stroke-width=".9" stroke-dasharray="4 4"/>
    <!-- normal right cord adducts, pulls the axis over -->
    <line x1="96" y1="34" x2="90" y2="150" stroke="#eab308" stroke-width="7" stroke-linecap="round"/>
    <!-- affected left cord: bowed, sits obliquely (askewed) -->
    <path d="M96 34 Q70 92 86 150" fill="none" stroke="#dc2626" stroke-width="9" stroke-linecap="round"/>
    <path d="M96 34 Q70 92 86 150" fill="none" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
    <!-- skew arrow -->
    <path d="M112 60 q22 24 6 60" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="150" y="92" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#b91c1c">anterior commissure</text>
    <text x="150" y="106" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#b91c1c">deviates → askewed</text>
    <text x="90" y="184" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">At phonation</text>
    <text x="90" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">glottis rotates toward the normal side</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- legend -->
  <g font-family="Inter, sans-serif" font-size="11.5" fill="#334155">
    <line x1="210" y1="288" x2="238" y2="288" stroke="#eab308" stroke-width="7" stroke-linecap="round"/>
    <text x="244" y="292">Normal cord</text>
    <line x1="340" y1="288" x2="368" y2="288" stroke="#dc2626" stroke-width="9" stroke-linecap="round"/>
    <line x1="340" y1="288" x2="368" y2="288" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
    <text x="374" y="292">Paralysed (bowed) cord</text>
  </g>
</svg>
