<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" aria-label="Superior view of the glottis showing the five vocal-cord positions from median to full abduction">
  <!-- Original diagram for CritCare.in — own work, released CC0. -->
  <title>The five vocal-cord positions (superior view)</title>
  <text x="150" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="14.5" font-weight="800" fill="#0f172a">Vocal-cord positions</text>
  <text x="150" y="41" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">superior (laryngoscopic) view — left cord fixed at midline</text>

  <!-- laryngeal outline / soft tissue (bell) -->
  <path d="M150 58 C110 72 66 108 56 172 C51 202 88 218 150 218 C212 218 249 202 244 172 C234 108 190 72 150 58 Z"
        fill="#d7e6f4" stroke="#5b4636" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- arytenoid hints at the posterior (bottom) -->
  <ellipse cx="132" cy="205" rx="14" ry="9" fill="#c2d6ea" stroke="#5b4636" stroke-width="1.3"/>
  <ellipse cx="168" cy="205" rx="14" ry="9" fill="#c2d6ea" stroke="#5b4636" stroke-width="1.3"/>

  <!-- midline -->
  <line x1="150" y1="52" x2="150" y2="224" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="150" y="238" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">anterior commissure ↑ · posterior ↓</text>

  <!-- LEFT cord: fixed near midline (median) reference -->
  <line x1="150" y1="66" x2="140" y2="198" stroke="#eab308" stroke-width="7" stroke-linecap="round"/>

  <!-- RIGHT cord shown at the five positions (fan from the anterior commissure) -->
  <g stroke-linecap="round">
    <line x1="150" y1="66" x2="160" y2="198" stroke="#eab308" stroke-width="7"/>            <!-- median -->
    <line x1="150" y1="66" x2="182" y2="202" stroke="#f59e0b" stroke-width="6"/>            <!-- paramedian -->
    <line x1="150" y1="66" x2="204" y2="200" stroke="#f59e0b" stroke-width="6"/>            <!-- intermediate / cadaveric -->
    <line x1="150" y1="66" x2="226" y2="190" stroke="#f59e0b" stroke-width="6"/>            <!-- slight abduction -->
    <line x1="150" y1="66" x2="244" y2="172" stroke="#f59e0b" stroke-width="6"/>            <!-- full abduction -->
  </g>

  <!-- leader labels on the right -->
  <g font-family="Inter, sans-serif" font-size="12" fill="#334155">
    <line x1="160" y1="150" x2="300" y2="92"  stroke="#94a3b8" stroke-width="1"/>
    <text x="306" y="90" font-weight="600">Median</text><text x="306" y="104" font-size="10.5" fill="#64748b">midline · speech</text>

    <line x1="176" y1="160" x2="300" y2="132" stroke="#94a3b8" stroke-width="1"/>
    <text x="306" y="130" font-weight="600">Paramedian</text><text x="306" y="144" font-size="10.5" fill="#64748b">1.5 mm · whisper</text>

    <line x1="196" y1="162" x2="300" y2="172" stroke="#94a3b8" stroke-width="1"/>
    <text x="306" y="170" font-weight="600">Intermediate (cadaveric)</text><text x="306" y="184" font-size="10.5" fill="#64748b">3.5 mm</text>

    <line x1="216" y1="156" x2="300" y2="212" stroke="#94a3b8" stroke-width="1"/>
    <text x="306" y="210" font-weight="600">Slight / gentle abduction</text><text x="306" y="224" font-size="10.5" fill="#64748b">7 mm · normal respiration</text>

    <line x1="232" y1="146" x2="300" y2="252" stroke="#94a3b8" stroke-width="1"/>
    <text x="306" y="250" font-weight="600">Full abduction</text><text x="306" y="264" font-size="10.5" fill="#64748b">9.5 mm · deep inspiration</text>
  </g>
</svg>
