<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Thyromental and sternomental distance measured on a head-and-neck profile">
  <!-- Original diagram for CritCare.in — own work, released CC0. -->
  <title>Thyromental &amp; sternomental distance</title>
  <defs>
    <marker id="dot" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5">
      <circle cx="4.5" cy="4.5" r="3.4" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- head + neck profile, facing right -->
  <path d="M150 152
           C150 72 212 42 276 56
           C301 61 313 86 316 110
           C330 118 349 129 353 141
           L357 151
           C351 157 339 157 331 159
           C337 165 337 169 331 173
           C343 177 343 183 333 187
           C345 191 349 197 345 207
           C339 217 323 223 307 227
           C301 251 297 263 293 281
           L289 323
           L250 341 L206 346
           C191 321 187 281 185 251
           C183 221 166 191 150 152 Z"
        fill="#fbeee7" stroke="#7c4a37" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- ear hint -->
  <path d="M198 150 q16 6 12 26 q-4 14 -18 12" fill="none" stroke="#7c4a37" stroke-width="1.6"/>

  <!-- measurement lines from chin (mentum) -->
  <line x1="345" y1="207" x2="298" y2="263" stroke="#1e6fd9" stroke-width="2.2" stroke-dasharray="6 5"/>
  <line x1="345" y1="207" x2="289" y2="322" stroke="#0d9488" stroke-width="2.2" stroke-dasharray="6 5"/>

  <!-- landmarks -->
  <circle cx="345" cy="207" r="4.2" fill="#b91c1c"/>
  <circle cx="298" cy="263" r="4.2" fill="#b91c1c"/>
  <circle cx="289" cy="322" r="4.2" fill="#b91c1c"/>

  <!-- landmark leader labels -->
  <g font-family="Inter, sans-serif" font-size="12.5" fill="#334155">
    <line x1="345" y1="207" x2="392" y2="196" stroke="#94a3b8" stroke-width="1"/>
    <text x="396" y="199" font-weight="600">Chin (mentum)</text>

    <line x1="298" y1="263" x2="392" y2="270" stroke="#94a3b8" stroke-width="1"/>
    <text x="396" y="273" font-weight="600">Thyroid notch</text>

    <line x1="289" y1="322" x2="392" y2="340" stroke="#94a3b8" stroke-width="1"/>
    <text x="396" y="343" font-weight="600">Suprasternal notch</text>
  </g>

  <!-- measurement callouts -->
  <g font-family="Inter, sans-serif" font-size="13">
    <text x="150" y="245" fill="#1e6fd9" font-weight="700">Thyromental</text>
    <text x="150" y="262" fill="#1e6fd9">distance &gt; 6.5 cm</text>
    <text x="118" y="300" fill="#0d9488" font-weight="700">Sternomental</text>
    <text x="118" y="317" fill="#0d9488">distance &gt; 12.5 cm</text>
  </g>

  <text x="300" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Thyromental &amp; sternomental distance</text>
  <text x="300" y="382" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#64748b">Measured with the head fully extended on the neck</text>
</svg>
