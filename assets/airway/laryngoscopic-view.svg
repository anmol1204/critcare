<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="Laryngoscopic (superior) view of the glottis with the epiglottis, true and false cords, arytenoids, aryepiglottic folds and pyriform sinuses labelled">
  <!-- Original diagram for CritCare.in — own work, released CC0. -->
  <title>Laryngoscopic view of the glottis</title>
  <text x="360" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="15.5" font-weight="800" fill="#0f172a">Laryngoscopic view of the glottis</text>
  <text x="360" y="43" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">the view at direct laryngoscopy — anterior (epiglottis) uppermost, posterior (arytenoids) below</text>

  <!-- ===== larynx, centred at x=360 ===== -->
  <!-- overall inlet mucosa -->
  <path d="M360 66 C280 66 224 128 219 216 C215 272 235 330 312 368 C337 384 383 384 408 368 C485 330 505 272 501 216 C496 128 440 66 360 66 Z"
        fill="#eeb4b4" stroke="#9a5a5a" stroke-width="2"/>

  <!-- pyriform sinuses (lateral recesses) -->
  <path d="M243 250 C232 288 250 320 286 330 C270 300 268 272 276 244 C262 240 250 242 243 250 Z" fill="#c98787" stroke="#9a5a5a" stroke-width="1.2"/>
  <path d="M477 250 C488 288 470 320 434 330 C450 300 452 272 444 244 C458 240 470 242 477 250 Z" fill="#c98787" stroke="#9a5a5a" stroke-width="1.2"/>

  <!-- aryepiglottic folds (ridges epiglottis → arytenoid) -->
  <path d="M286 150 C270 210 276 300 312 356" fill="none" stroke="#b56b6b" stroke-width="3"/>
  <path d="M434 150 C450 210 444 300 408 356" fill="none" stroke="#b56b6b" stroke-width="3"/>

  <!-- epiglottis (petiole points down to the anterior commissure) -->
  <path d="M360 78 C305 80 272 116 278 162 C312 146 408 146 442 162 C448 116 415 80 360 78 Z" fill="#f2caca" stroke="#9a5a5a" stroke-width="1.6"/>
  <path d="M354 158 L360 178 L366 158 Z" fill="#e0a3a3" stroke="#9a5a5a" stroke-width="1"/>

  <!-- dark glottis (airway) -->
  <path d="M360 176 L338 350 L382 350 Z" fill="#242424"/>

  <!-- false cords (vestibular / ventricular bands) — lateral, deeper pink -->
  <path d="M356 172 L330 344 L306 336 L350 176 Z" fill="#dc9797" stroke="#a85f5f" stroke-width="1"/>
  <path d="M364 172 L390 344 L414 336 L370 176 Z" fill="#dc9797" stroke="#a85f5f" stroke-width="1"/>

  <!-- true vocal cords (pearly white) flanking the glottis -->
  <path d="M360 174 L340 348 L322 342 L353 176 Z" fill="#f7f6f0" stroke="#b3b0a4" stroke-width="1.2"/>
  <path d="M360 174 L380 348 L398 342 L367 176 Z" fill="#f7f6f0" stroke="#b3b0a4" stroke-width="1.2"/>

  <!-- arytenoids with vocal processes (posterior) -->
  <ellipse cx="336" cy="356" rx="16" ry="11" fill="#e2a1a1" stroke="#9a5a5a" stroke-width="1.3"/>
  <ellipse cx="384" cy="356" rx="16" ry="11" fill="#e2a1a1" stroke="#9a5a5a" stroke-width="1.3"/>
  <!-- posterior commissure between arytenoids -->
  <path d="M352 360 C356 366 364 366 368 360" fill="none" stroke="#8a4f4f" stroke-width="1.4"/>

  <!-- ================= labels ================= -->
  <g font-family="Inter, sans-serif" font-size="12.5" fill="#334155">
    <!-- top: petiole / anterior commissure -->
    <line x1="360" y1="160" x2="360" y2="62" stroke="#94a3b8" stroke-width="1"/>
    <text x="360" y="58" text-anchor="middle" font-weight="600">Petiole of epiglottis &amp; anterior commissure</text>

    <!-- LEFT labels -->
    <line x1="286" y1="120" x2="150" y2="120" stroke="#94a3b8" stroke-width="1"/>
    <text x="146" y="123" text-anchor="end" font-weight="600">Laryngeal introitus</text>

    <line x1="308" y1="250" x2="150" y2="250" stroke="#94a3b8" stroke-width="1"/>
    <text x="146" y="247" text-anchor="end" font-weight="600">True vocal cord</text>
    <text x="146" y="262" text-anchor="end" font-size="10.5" fill="#64748b">(medial, pearly white)</text>

    <line x1="266" y1="300" x2="150" y2="320" stroke="#94a3b8" stroke-width="1"/>
    <text x="146" y="317" text-anchor="end" font-weight="600">Pyriform sinus</text>

    <!-- RIGHT labels -->
    <line x1="406" y1="200" x2="560" y2="180" stroke="#94a3b8" stroke-width="1"/>
    <text x="566" y="177" font-weight="600">False vocal cord</text>
    <text x="566" y="192" font-size="10.5" fill="#64748b">(ventricular band)</text>

    <line x1="372" y1="250" x2="560" y2="250" stroke="#94a3b8" stroke-width="1"/>
    <text x="566" y="253" font-weight="600">Glottis (rima glottidis)</text>

    <line x1="440" y1="230" x2="560" y2="300" stroke="#94a3b8" stroke-width="1"/>
    <text x="566" y="297" font-weight="600">Aryepiglottic fold</text>

    <line x1="392" y1="352" x2="560" y2="345" stroke="#94a3b8" stroke-width="1"/>
    <text x="566" y="342" font-weight="600">Vocal process</text>
    <text x="566" y="357" font-size="10.5" fill="#64748b">of arytenoid</text>

    <!-- bottom: posterior commissure -->
    <line x1="360" y1="366" x2="360" y2="410" stroke="#94a3b8" stroke-width="1"/>
    <text x="360" y="424" text-anchor="middle" font-weight="600">Posterior commissure</text>
  </g>
</svg>
